<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Memopad</title>
  <meta name="description" content="A clean, modern macOS-styled memopad application.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- macOS Window -->
  <div class="macos-window">
    <!-- Window Titlebar -->
    <header class="titlebar">
      <div class="traffic-lights">
        <span class="traffic-btn traffic-close" title="Close" onclick="showToast('Window closed')"></span>
        <span class="traffic-btn traffic-minimize" title="Minimize" onclick="showToast('Window minimized')"></span>
        <span class="traffic-btn traffic-maximize" title="Maximize" onclick="toggleFullScreen()"></span>
      </div>
      <div class="window-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Notes — Memopad
      </div>
      <div class="titlebar-actions">
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <span id="themeIcon">🌙</span> Theme
        </button>
      </div>
    </header>

    <!-- App Body (Sidebar + Editor) -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="handleSearch(this.value)">
          </div>
          <button class="new-note-btn" onclick="createNewNote()">
            <span>+</span> New Note
          </button>
        </div>
        <div class="notes-list" id="notesList">
          <!-- Dynamically populated note list -->
        </div>
      </aside>

      <!-- Editor Pane -->
      <main class="editor-pane">
        <!-- Editor Action Bar -->
        <div class="editor-toolbar">
          <div class="toolbar-left">
            <button class="btn btn-primary" id="saveBtn" onclick="saveCurrentNote()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Save (⌘S)
            </button>
            <button class="btn" id="resetBtn" onclick="resetCurrentNote()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              Reset
            </button>
          </div>

          <div class="toolbar-right">
            <button class="btn" onclick="exportNote()" title="Download as text file">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Export
            </button>
            <button class="btn btn-danger" onclick="deleteCurrentNote()" title="Delete this note">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Delete
            </button>
          </div>
        </div>

        <!-- Inputs Content Area -->
        <div class="editor-content">
          <input type="text" id="noteTitle" class="input-title" placeholder="Note Title" autocomplete="off"
            oninput="handleContentChange()">
          <textarea id="noteBody" class="input-body" placeholder="Type your notes here..."
            oninput="handleContentChange()"></textarea>
        </div>

        <!-- Statusbar -->
        <footer class="statusbar">
          <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="saveStatusText">All changes saved</span>
          </div>
          <div id="wordCountText">0 words | 0 characters</div>
        </footer>
      </main>
    </div>
  </div>

  <!-- Toast Element -->
  <div class="toast" id="toastMessage">Saved successfully!</div>

  <script src="app.js"></script>
</body>

</html>
